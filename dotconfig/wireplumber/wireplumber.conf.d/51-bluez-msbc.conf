# Disable mSBC (wideband HFP speech codec) for the Intel AX211 adapter.
# Kernel logs showed "corrupted SCO packet" / "unknown connection handle"
# during HFP calls with the "Ananas" headset, a known AX211+mSBC failure
# mode that leaves bluez_input/bluez_output pipewire nodes stuck in error
# state until the device is disconnected/reconnected. Forcing CVSD avoids it.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
