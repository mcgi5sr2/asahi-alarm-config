config_version = 14

[bar.default]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "cpu",
    "control-center",
    "session"
]
margin_ends = 0
start = [ "launcher", "scale", "wallpaper", "workspaces", "media" ]

[lockscreen]
fingerprint = false
wallpaper = "/home/mcgi5sr2/Videos/wallpapers/250956_full_24fps.webp"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1768.0
    cy = 115.00002288818359
    output = "eDP-1"
    placement_height = 1260.0
    placement_width = 2016.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.20000000000000001
        background_radius = 10.0
        center_password_text = false
        input_opacity = 0.5
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 720.0
    cx = 1477.5
    cy = 1400.9964599609375
    output = "winit"
    placement_height = 1770.0
    placement_width = 2955.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_colorize = false
polkit_agent = true

    [shell.launcher]
    compact = true

[theme]
builtin = "Noctalia"
custom_palette = "VSCodeDark"
mode = "dark"
source = "custom"

    [theme.templates]
    builtin_ids = [ "kitty", "qt" ]

[wallpaper.default]
path = "/home/mcgi5sr2/Pictures/grisWallpapers/gris01.png"

[wallpaper.last]
path = "/home/mcgi5sr2/Pictures/grisWallpapers/gris01.png"

[wallpaper.monitors.eDP-1]
path = "/home/mcgi5sr2/Pictures/grisWallpapers/gris01.png"

[widget.battery]
color = "#4ec9b0"
icon_color = "#4ec9b0"
type = "battery"

[widget.bluetooth]
color = "#569cd6"
icon_color = "#569cd6"
type = "bluetooth"

[widget.brightness]
color = "#d7ba7d"
icon_color = "#d7ba7d"
type = "brightness"

[widget.clock]
color = "primary"
type = "clock"

[widget.media]
hide_when_no_media = true
max_length = 260
title_scroll = "on_hover"
type = "media"

[widget.network]
color = "#6a9955"
icon_color = "#6a9955"
type = "network"

[widget.scale]
glyph = "aspect-ratio"
type = "custom_button"

    [widget.scale.actions]
    left = "exec /home/mcgi5sr2/.config/niri/scripts/scale-switcher.sh"

[widget.session]
color = "error"
icon_color = "error"
type = "session"

[widget.volume]
color = "tertiary"
icon_color = "tertiary"
type = "volume"

[widget.workspaces]
focused_color = "primary"
occupied_color = "secondary"
type = "workspaces"
# Power off after 15 min idle on battery (the lid switch is ignored, so a closed
# laptop otherwise drains flat). On AC it waits until unplugged for 15 min.
[idle.behavior.poweroff-on-battery]
timeout = 900
action = "command"
command = "/home/mcgi5sr2/.local/bin/idle-poweroff-on-battery"
resume_command = "pkill -f idle-poweroff-on-battery"
