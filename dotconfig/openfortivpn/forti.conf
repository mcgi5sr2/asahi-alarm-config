# Fortinet SSL VPN (replaces FortiClient, which left its VPN DNS in the Wi-Fi
# profile after disconnecting). Used by scripts/forti-vpn.
# The repo copy is a template: set host and username in the installed copy only.
# The ip-up hook reads its resolved-* lines from /etc/openfortivpn/forti.conf.
host = vpn.example.org
port = 443
# username = <your VPN username>

# Never let openfortivpn or pppd rewrite /etc/resolv.conf; the ip-up hook
# (dotetc/ppp/ip-up.d/openfortivpn-resolved) sets per-link DNS in resolved instead.
set-dns = 0
use-resolvconf = 0
pppd-use-peerdns = 1
pppd-ipparam = openfortivpn-forti
set-routes = 1

# Reconnect every 10 s after a drop (Wi-Fi blip, suspend) until stopped.
persistent = 10
