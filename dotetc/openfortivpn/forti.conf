# Fortinet SSL VPN, root-owned copy used by /usr/local/sbin/forti-vpn-ctl
# (bar button). Root never reads the user-writable ~/.config copy.
# The repo copy is a template: set host, username and the resolved-* lines in
# the installed copy only, never here.
host = vpn.example.org
port = 443
# username = <your VPN username>

# Read by the ip-up hook (dotetc/ppp/ip-up.d/openfortivpn-resolved), not by
# openfortivpn: the tunnel's resolved routing domains, and DNS servers to use
# when pppd gets none from the gateway.
# resolved-domains = example.org ~example.net
# resolved-dns = 192.0.2.53 192.0.2.54

# Never let openfortivpn or pppd rewrite /etc/resolv.conf; the ip-up hook
# sets per-link DNS in resolved instead.
set-dns = 0
use-resolvconf = 0
pppd-use-peerdns = 1
pppd-ipparam = openfortivpn-forti
set-routes = 1

# Reconnect every 10 s after a drop (Wi-Fi blip, suspend) until stopped.
persistent = 10
